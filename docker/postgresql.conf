# Explicit experimental settings for the HNSW churn/maintenance study.
# Unlisted parameters keep Postgres 18's compiled-in default.

# This file replaces the container's default config entirely, so
# listen_addresses needs to be set here explicitly.
listen_addresses = '*'

# Correctness-critical: must never fire mid-experiment. See PLAN.md.
autovacuum = off

# Sized for the 8GB container limit in docker-compose.yml, deliberately
# above the usual 25%-of-RAM rule of thumb. See commit message.
shared_buffers = 4GB

# Governs REINDEX/HNSW-build speed directly — fixed and recorded rather
# than left at the 64MB default.
maintenance_work_mem = 2GB

# Explicit rather than left at the 4MB default.
work_mem = 256MB

# Durability GUCs are experimental variables too, kept at Postgres's own
# defaults deliberately. See PLAN.md.
fsync = on
synchronous_commit = on

# Closest to deterministic serial HNSW builds pgvector allows. See PLAN.md.
max_parallel_maintenance_workers = 0
