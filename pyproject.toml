[project]
name = "hnsw-bench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "faiss-cpu",
    "psycopg[binary]",
    "pgvector",
    "pyyaml",
]

[project.optional-dependencies]
ui = ["streamlit", "pandas", "psutil"]
analysis = ["pandas", "scipy", "statsmodels", "matplotlib", "seaborn"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
